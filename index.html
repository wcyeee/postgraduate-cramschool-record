<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>補習班課程管理系統</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">

<link rel="icon" type="image/svg+xml" href="book.svg">

<style>
  :root {
    --bg: #1a1a1a;
    --surface: #242424;
    --surface2: #2e2e2e;
    --border: #404040;
    --accent: #b0b0b0;
    --accent2: #888888;
    --accent3: #888888;
    --accent4: #888888;   
    --accent5: #cc6666;  
    --text: #ececec;
    --text2: #b5b5b5;
    --text3: #868686;
    --radius: 12px;
    --shadow: 0 4px 24px rgba(0,0,0,0.5);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Noto Sans TC', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

  /* Layout */
  .app { display: flex; flex-direction: column; min-height: 100vh; }
  .topnav {
    position: fixed; top: 0; left: 0; right: 0; height: 52px;
    background: var(--surface); border-bottom: 1px solid var(--border);
    display: flex; align-items: center; padding: 0 24px; gap: 4px; z-index: 100;
  }
  .topnav-logo { font-family: 'Space Grotesk', sans-serif; font-size: 14px; font-weight: 700; color: var(--accent); margin-right: 20px; white-space: nowrap; }
  .nav-item {
    display: flex; align-items: center; gap: 6px; padding: 7px 14px; border-radius: 8px;
    cursor: pointer; color: var(--text2); font-size: 13px; transition: all 0.2s;
  }
  .nav-item:hover { background: var(--surface2); color: var(--text); }
  .nav-item.active { background: rgba(255,255,255,0.1); color: var(--accent); }
  .nav-item svg { width: 15px; height: 15px; flex-shrink: 0; }
  .main { margin-left: 0; flex: 1; padding: 80px 32px 28px; }
  .page { display: none; } .page.active { display: block; }

  /* Header */
  .page-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 28px; }
  .page-title { font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 600; }
  .page-subtitle { font-size: 13px; color: var(--text3); margin-top: 2px; }

  /* Buttons */
  .btn {
    display: inline-flex; align-items: center; gap: 6px; padding: 9px 18px; border-radius: 8px;
    font-size: 13.5px; font-weight: 500; cursor: pointer; border: none; transition: all 0.2s; font-family: inherit;
  }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: #888; transform: translateY(-1px); }
  .btn-ghost { background: transparent; color: var(--text2); border: 1px solid var(--border); }
  .btn-ghost:hover { background: var(--surface2); color: var(--text); }
  .btn-sm { padding: 6px 12px; font-size: 12px; }
  .btn-danger { background: rgba(248,113,113,0.15); color: var(--accent5); border: 1px solid rgba(248,113,113,0.2); }
  .btn-danger:hover { background: rgba(248,113,113,0.25); }

  /* Cards */
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; }
  .card-title { font-size: 13px; font-weight: 500; color: var(--text2); margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.5px; }

  /* Stats row */
  .stats-row { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; margin-bottom: 24px; }
  .stat-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 16px; cursor: pointer; transition: all 0.2s;
  }
  .stat-card:hover { border-color: var(--accent); transform: translateY(-2px); }
  .stat-label { font-size: 11px; color: var(--text3); margin-bottom: 6px; }
  .stat-name { font-size: 12.5px; font-weight: 600; color: var(--text); margin-bottom: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .stat-bar-bg { height: 4px; background: var(--surface2); border-radius: 2px; }
  .stat-bar { height: 4px; border-radius: 2px; transition: width 0.8s ease; }
  .stat-pct { font-size: 11px; color: var(--text2); margin-top: 5px; }

  /* Calendar */
  .calendar-wrap { display: grid; grid-template-columns: 1fr 320px; gap: 20px; margin-bottom: 24px; }
  .calendar-grid { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; }
  .cal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .cal-month { font-family: 'Space Grotesk', sans-serif; font-size: 16px; font-weight: 600; }
  .cal-nav { display: flex; gap: 8px; }
  .cal-nav-btn { width: 30px; height: 30px; border-radius: 6px; border: 1px solid var(--border); background: transparent; color: var(--text2); cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
  .cal-nav-btn:hover { background: var(--surface2); color: var(--text); }
  .cal-days-header { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; margin-bottom: 4px; }
  .cal-day-label { text-align: center; font-size: 11px; color: var(--text3); padding: 4px 0; }
  .cal-days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
  .cal-day {
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    padding: 3px 2px; border-radius: 6px; cursor: pointer; position: relative; transition: background 0.15s;
    min-height: clamp(44px, 9vw, 80px);
    overflow: hidden;
  }
  .cal-day:hover { background: var(--surface2); }
  .cal-day.other-month .cal-day-num { color: var(--text3); }
  .cal-day.today { background: rgba(246, 247, 248, 0.12); }
  .cal-day.today .cal-day-num { color: var(--accent); font-weight: 700; }
  .cal-day-num { font-size: 12px; font-weight: 500; color: var(--text); }
  .cal-dots { display: flex; gap: 2px; flex-wrap: wrap; justify-content: center; margin-top: 2px; }
  .cal-dot { width: 5px; height: 5px; border-radius: 50%; }

  /* Side panel */
  .side-panel { display: flex; flex-direction: column; gap: 14px; }
  .upcoming-list { display: flex; flex-direction: column; gap: 8px; max-height: 480px; overflow-y: auto; }
  .event-item { background: var(--surface2); border-radius: 8px; padding: 10px 12px; border-left: 3px solid var(--accent); }
  .event-time { font-size: 11px; color: var(--text3); margin-bottom: 3px; }
  .event-name { font-size: 13px; font-weight: 500; color: var(--text); }
  .event-meta { font-size: 11px; color: var(--text2); margin-top: 2px; }

  /* Progress section */
  .progress-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  .progress-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; }
  .progress-card-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 12px; }
  .progress-course-name { font-size: 14px; font-weight: 600; color: var(--text); }
  .progress-badge { font-size: 11px; padding: 2px 8px; border-radius: 20px; font-weight: 500; }
  .progress-stats { display: flex; gap: 16px; margin-bottom: 12px; }
  .progress-stat-val { font-size: 18px; font-weight: 700; }
  .progress-stat-label { font-size: 11px; color: var(--text3); }
  .progress-bar-bg { height: 6px; background: var(--surface2); border-radius: 3px; overflow: hidden; }
  .progress-bar { height: 100%; border-radius: 3px; transition: width 1s ease; }
  .last-lesson { font-size: 12px; color: var(--text3); margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); }

  /* Modal */
  .modal-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 1000;
    align-items: center; justify-content: center; padding: 20px;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
    width: 100%; max-width: 520px; max-height: 90vh; overflow-y: auto;
    box-shadow: 0 20px 60px rgba(0,0,0,0.6); animation: slideUp 0.25s ease;
  }
  @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
  .modal-header { padding: 20px 24px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
  .modal-title { font-size: 16px; font-weight: 600; }
  .modal-close { width: 30px; height: 30px; border-radius: 6px; border: none; background: transparent; color: var(--text2); cursor: pointer; font-size: 18px; display: flex; align-items: center; justify-content: center; transition: background 0.2s; }
  .modal-close:hover { background: var(--surface2); }
  .modal-body { padding: 20px 24px; }
  .modal-footer { padding: 16px 24px 20px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 10px; }

  /* Form */
  .form-group { margin-bottom: 16px; }
  .form-label { display: block; font-size: 13px; font-weight: 500; color: var(--text2); margin-bottom: 6px; }
  .form-control {
    width: 100%; background: var(--surface2); border: 1px solid var(--border); border-radius: 8px;
    padding: 9px 12px; color: var(--text); font-size: 13.5px; outline: none; transition: border-color 0.2s; font-family: inherit;
  }
  .form-control:focus { border-color: var(--accent); }
  select.form-control option { background: var(--surface2); }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  /* Lesson list */
  .lessons-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .lessons-list { display: flex; flex-direction: column; gap: 8px; }
  /* 電腦版：課程記錄分組標題 */
  .lesson-group-header {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 0 6px; margin-top: 12px;
    border-bottom: 1px solid var(--border);
    font-size: 13px; font-weight: 600; color: var(--text2);
  }
  .lesson-group-header:first-child { margin-top: 0; }
  .lesson-item {
    background: var(--surface2); border-radius: 8px; padding: 12px 14px;
    display: flex; align-items: center; gap: 12px; border: 1px solid transparent; transition: border-color 0.2s;
  }
  .lesson-item:hover { border-color: var(--border); }
  .lesson-num { width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; flex-shrink: 0; }
  .lesson-info { flex: 1; }
  .lesson-name { font-size: 13.5px; font-weight: 500; color: var(--text); }
  .lesson-meta { font-size: 12px; color: var(--text3); margin-top: 2px; }
  .lesson-actions { display: flex; gap: 6px; }

  /* Schedule page */
  .schedule-filters { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
  .filter-btn { padding: 6px 14px; border-radius: 20px; font-size: 12.5px; font-weight: 500; cursor: pointer; border: 1px solid var(--border); background: transparent; color: var(--text2); transition: all 0.2s; font-family: inherit; }
  .filter-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .schedule-list { display: flex; flex-direction: column; gap: 10px; }
  .schedule-item {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 14px 18px; display: flex; align-items: center; gap: 16px;
  }
  .schedule-time-block { text-align: center; min-width: 80px; }
  .schedule-date { font-size: 13px; font-weight: 600; color: var(--text); }
  .schedule-time { font-size: 12px; color: var(--text3); }
  .schedule-divider { width: 1px; height: 40px; background: var(--border); }
  .schedule-info { flex: 1; }
  .schedule-course { font-size: 14px; font-weight: 600; color: var(--text); }
  .schedule-detail { font-size: 12px; color: var(--text2); margin-top: 3px; }
  .schedule-status { padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 500; }
  .status-scheduled { background: rgba(160,160,160,0.15); color: var(--accent); }
  .status-completed { background: rgba(140,140,140,0.2); color: var(--text2); }

  /* Colors per course */
  .c0 { --cc: #6c8ef7; } .c1 { --cc: #a78bfa; } .c2 { --cc: #34d399; } 
  .c3 { --cc: #f59e0b; } .c4 { --cc: #f87171; } .c5 { --cc: #38bdf8; }

  /* Notification */
  .toast {
    position: fixed; bottom: 24px; right: 24px; background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; padding: 12px 18px; font-size: 13.5px; box-shadow: var(--shadow);
    z-index: 9999; transform: translateY(80px); opacity: 0; transition: all 0.3s;
  }
  .toast.show { transform: translateY(0); opacity: 1; }
  .toast.success { border-left: 3px solid #888; }
  .toast.error   { border-left: 3px solid var(--accent5); }

  /* Tabs */
  .tabs { display: flex; gap: 4px; background: var(--surface2); border-radius: 10px; padding: 4px; margin-bottom: 20px; width: fit-content; }
  .tab { padding: 7px 16px; border-radius: 7px; font-size: 13px; font-weight: 500; cursor: pointer; color: var(--text2); transition: all 0.2s; }
  .tab.active { background: var(--surface); color: var(--text); box-shadow: 0 1px 4px rgba(0,0,0,0.3); }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; } ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  /* Loading */
  .loading { text-align: center; padding: 40px; color: var(--text3); font-size: 14px; }
  .spinner { width: 24px; height: 24px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 12px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .empty-state { text-align: center; padding: 40px; color: var(--text3); }
  .empty-icon { font-size: 36px; margin-bottom: 12px; }
  .empty-text { font-size: 14px; }

  /* Segment input */
  .segment-input { display: flex; gap: 8px; align-items: center; }
  .segment-label { font-size: 13px; color: var(--text2); white-space: nowrap; }
  
  /* Day detail popup */
  .day-popup {
    position: absolute; z-index: 200; background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; padding: 12px; min-width: 200px; box-shadow: var(--shadow);
    left: 50%; transform: translateX(-50%); top: 100%; margin-top: 4px;
  }
  .cal-day { position: relative; }

  @media (max-width: 1024px) {
    .stats-row { grid-template-columns: repeat(3, 1fr); }
    .progress-grid { grid-template-columns: repeat(2, 1fr); }
    .calendar-wrap { grid-template-columns: 1fr; }
    .side-panel { flex-direction: row; }
    .side-panel .card { flex: 1; }
    .main { padding: 72px 20px 24px; }
  }
  @media (max-width: 480px) {
    /* Topnav 改成可捲動 */
    .topnav {
      padding: 0 12px;
      gap: 2px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .topnav::-webkit-scrollbar { display: none; }
    .topnav-logo { font-size: 12px; margin-right: 8px; flex-shrink: 0; }
    .nav-item { padding: 6px 10px; font-size: 12px; white-space: nowrap; flex-shrink: 0; }

    /* 主內容 */
    .main { padding: 64px 12px 20px; }
    .page-title { font-size: 18px; }
    .page-header { flex-wrap: wrap; gap: 10px; }

    /* 統計卡片：2欄 */
    .stats-row { grid-template-columns: repeat(2, 1fr); gap: 8px; }

    /* 日曆 + 側欄：直排 */
    .calendar-wrap { grid-template-columns: 1fr; }
    .cal-day { min-height: 48px; overflow: hidden; }
    .cal-day-num { font-size: 11px; line-height: 1.2; }

    /* 進度卡片：1欄 */
    .progress-grid { grid-template-columns: 1fr; }

    /* 排課篩選：可橫向捲動 */
    .schedule-filters { flex-wrap: nowrap; overflow-x: auto; -webkit-overflow-scrolling: touch; padding-bottom: 4px; }
    .schedule-filters::-webkit-scrollbar { display: none; }
    .filter-btn { white-space: nowrap; flex-shrink: 0; }

    /* 排課列表 */
    .schedule-item { flex-wrap: wrap; gap: 10px; }
    .schedule-divider { display: none; }

    /* Modal 全螢幕 */
    .modal { max-width: 100% !important; max-height: 95vh; border-radius: 16px 16px 0 0; }
    .modal-overlay { align-items: flex-end; padding: 0; }

    /* form row 改單欄 */
    .modal-body { padding: 16px; }
    .modal-footer { padding: 12px 16px; }
    .form-control { font-size: 16px; } /* 防止 iOS 自動縮放 */

    /* 課程記錄列 */
    .lesson-item { flex-wrap: wrap; }
    .lesson-actions { width: 100%; justify-content: flex-end; margin-top: 4px; }
    #page-lessons > div[style*="grid"] {
      grid-template-columns: 1fr !important;
    }
  }
  .material-symbols-rounded { font-size: inherit; vertical-align: middle; line-height: 1; user-select: none; }
</style>

</head>



<body>
<div class="app">
  
  <div class="topnav">
    <div class="topnav-logo" style="display:flex;align-items:center;gap:6px">
      <span class="material-symbols-rounded" style="font-size:18px">school</span>
      <div>補習班</div>
    </div>
      <div class="nav-item active" data-page="home" onclick="navigate('home')">
        首頁
      </div>
    <div class="nav-item" data-page="lessons" onclick="navigate('lessons')">課程記錄 & 排課管理</div>
  </div>

  <!-- Main -->
  <main class="main">

    <!-- Home Page -->
    <div id="page-home" class="page">
      <div class="page-header">
        <div>
          <div class="page-title">總覽</div>
          <div class="page-subtitle">本月課程進度與行程</div>
        </div>
        <div style="display:flex;gap:10px">
          <button class="btn btn-ghost" onclick="openRecordModal()">+ 記錄上課</button>
          <button class="btn btn-primary" onclick="openScheduleModal()">+ 新增排課</button>
        </div>
      </div>

      <!-- Stats -->
      <div id="stats-row" class="stats-row"></div>

      <!-- Calendar + Upcoming -->
      <div class="calendar-wrap">
        <div class="calendar-grid">
          <div class="cal-header">
            <div class="cal-month" id="cal-month-label"></div>
            <div class="cal-nav">
              <button class="cal-nav-btn" onclick="calPrev()">‹</button>
              <button class="cal-nav-btn" onclick="calNext()">›</button>
            </div>
          </div>
          <div class="cal-days-header">
            <div class="cal-day-label">日</div><div class="cal-day-label">一</div>
            <div class="cal-day-label">二</div><div class="cal-day-label">三</div>
            <div class="cal-day-label">四</div><div class="cal-day-label">五</div>
            <div class="cal-day-label">六</div>
          </div>
          <div id="cal-days" class="cal-days"></div>
        </div>
        <div class="side-panel">
          <div class="card">
            <div class="card-title">即將上課</div>
            <div id="upcoming-list" class="upcoming-list"></div>
          </div>
          <div class="card">
            <div class="card-title">目前上課進度</div>
            <div id="current-progress-list" style="display:flex;flex-direction:column;gap:8px"></div>
          </div>
        </div>
      </div>

      <!-- Progress -->
      <div style="margin-bottom:16px;display:flex;align-items:center;justify-content:space-between">
        <div style="font-size:15px;font-weight:600">課程進度</div>
      </div>
      <div id="progress-grid" class="progress-grid"></div>
    </div>

    <!-- Lessons Page + Schedule Page -->
    <div id="page-lessons" class="page">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:50px;align-items:start">
        <!-- Lessons Page -->
        <div>
      <div class="page-header">
        <div>
          <div class="page-title">課程記錄</div>
          <div class="page-subtitle">記錄每堂課的上課情況</div>
        </div>
        <button class="btn btn-primary" onclick="openRecordModal()">+ 記錄上課</button>
      </div>
      <div id="lessons-filter-wrap" class="lessons-header">
        <select id="lesson-course-filter" class="form-control" style="width:200px"></select>
      </div>
      <div id="lessons-list" class="lessons-list"></div>
    </div>
    <!-- Schedule Page -->
        <div>
      <div class="page-header">
        <div>
          <div class="page-title">排課管理</div>
          <div class="page-subtitle">安排與追蹤課程時程</div>
        </div>
        <button class="btn btn-primary" onclick="openScheduleModal()">+ 新增排課</button>
      </div>
      <div class="schedule-filters">
        <button class="filter-btn active" data-filter="all" onclick="setScheduleFilter('all')">全部</button>
        <button class="filter-btn" data-filter="upcoming" onclick="setScheduleFilter('upcoming')">即將上課</button>
        <button class="filter-btn" data-filter="completed" onclick="setScheduleFilter('completed')">已完成</button>
        <span style="width:1px;background:var(--border);height:28px;display:inline-block;margin:0 4px"></span>
        <button class="filter-btn" data-filter="ds" onclick="setScheduleFilter('ds')">資料結構</button>
        <button class="filter-btn" data-filter="co" onclick="setScheduleFilter('co')">計算機概論</button>
        <button class="filter-btn" data-filter="net" onclick="setScheduleFilter('net')">網際網路概論</button>
        <button class="filter-btn" data-filter="db" onclick="setScheduleFilter('db')">資料庫</button>
        <button class="filter-btn" data-filter="mis" onclick="setScheduleFilter('mis')">MIS</button>
        <button class="filter-btn" data-filter="ai" onclick="setScheduleFilter('ai')">AI</button>
      </div>
      <div id="schedule-list" class="schedule-list"></div>
        </div>
      </div>
    </div>

  </main>
</div>

  }

      return `<div class="stat-card" onclick="goToProgress('${c.id}')">

      </div>`;
    }).join('');

  function renderCalendar() {
    const { currentMonth: m, currentYear: y } = state;
    const months = ['一月','二月','三月','四月','五月','六月','七月','八月','九月','十月','十一月','十二月'];
    document.getElementById('cal-month-label').textContent = `${y} 年 ${months[m]}`;

    const firstDay = new Date(y, m, 1).getDay();
    const daysInMonth = new Date(y, m+1, 0).getDate();
    const today = new Date();

    // Build event map
    const evMap = {};
    const activeSchedules = state.schedules.filter(s => s.status !== 'completed');
    [...state.records, ...activeSchedules].forEach(item => {
      if (!item.date) return;
      const d = item.date.split('T')[0];
      if (!evMap[d]) evMap[d] = [];
      evMap[d].push(item);
    });

    let html = '';
    const startPad = firstDay;
    const prevDays = new Date(y, m, 0).getDate();
    for (let i = startPad - 1; i >= 0; i--) {
      html += `<div class="cal-day other-month"><span class="cal-day-num">${prevDays - i}</span></div>`;
    }
    for (let d = 1; d <= daysInMonth; d++) {
      const dateStr = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      const isToday = d === today.getDate() && m === today.getMonth() && y === today.getFullYear();

      const c = COURSES.find(c2 => c2.id === ev.courseId);
      const color = c ? getCourseColor(c.color) : '#6c8ef7';
      const isRecord = state.records.includes(ev);
      const label = c?.name?.slice(0,4) || '';
      const time = ev.time ? ev.time.slice(0,5) : '';
      return `<div style="background:${color}22;color:${color};font-size:10.5px;border-radius:3px;padding:2px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;margin-top:2px;font-weight:500">${isRecord?'<span class="material-symbols-rounded" style="font-size:10px;vertical-align:middle">check</span>':''} ${label} ${time}</div>`;
    }).join('');
      html += `<div class="cal-day${isToday?' today':''}" onclick="showDayDetail('${dateStr}')">
        <span class="cal-day-num">${d}</span>
        ${eventTags}
      </div>`;
    }
    const remaining = 42 - startPad - daysInMonth;
    for (let d = 1; d <= remaining; d++) {
      html += `<div class="cal-day other-month"><span class="cal-day-num">${d}</span></div>`;
    }
    document.getElementById('cal-days').innerHTML = html;
  }

  function renderUpcoming() {
    const today = new Date().toISOString().split('T')[0];
    const upcoming = state.schedules
      .filter(s => s.date >= today && s.status !== 'completed')
      .sort((a,b) => a.date.localeCompare(b.date))

    const el = document.getElementById('upcoming-list');
    if (!upcoming.length) {
      el.innerHTML = '<div class="empty-state"><span class="material-symbols-rounded empty-icon" style="font-size:36px">calendar_today</span><div class="empty-text">暫無排課</div></div>';
      return;
    }
    el.innerHTML = upcoming.map(s => {
      const c = COURSES.find(c2 => c2.id === s.courseId);
      const color = c ? getCourseColor(c.color) : '#6c8ef7';
      const dateStr = formatDate(s.date);
      return `<div class="event-item" style="border-left-color:${color};cursor:pointer" onclick="openEditScheduleModal('${s.id}')">
        <div class="event-time">${dateStr} ${s.time || ''}</div>
        <div class="event-name">${c?.name || ''}</div>
        <div class="event-meta">${s.minutes ? s.minutes+'分鐘' : ''} ${s.fromLesson !== undefined ? `第${s.fromLesson+1}堂` : ''} <span class="material-symbols-rounded" style="font-size:13px;vertical-align:middle">edit</span></div>
      </div>`;
    }).join('');
  }

  function renderCurrentProgress() {
    const el = document.getElementById('current-progress-list');
    if (!el) return;
    const items = COURSES.map(c => {
      const last = getLastLesson(c.id);
      if (!last) return null;
      const lessonName = LESSONS[c.id]?.[last.lessonIndex] || '';
      const color = getCourseColor(c.color);
      let progressStr = '';
      if (last.status === 'partial' && last.partialAt != null) {
        const h = Math.floor(last.partialAt / 3600);
        const m = Math.floor((last.partialAt % 3600) / 60);
        const s = last.partialAt % 60;
        progressStr = `${h ? h+'時' : ''}${m}分${s}秒`;
      } else {
        progressStr = '已完成整堂';
      }
      return `<div style="display:flex;align-items:center;gap:10px;padding:8px 10px;background:var(--surface2);border-radius:8px;border-left:3px solid ${color}">
        <div style="flex:1;min-width:0">
          <div style="font-size:12px;font-weight:600;color:${color};margin-bottom:2px">${c.name}</div>
          <div style="font-size:12px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${lessonName}</div>
          <div style="font-size:11px;color:var(--text3);margin-top:2px">${progressStr}</div>
        </div>
      </div>`;
    }).filter(Boolean).join('');
    el.innerHTML = items || '<div style="font-size:13px;color:var(--text3);padding:8px">尚無上課紀錄</div>';
  }

  function renderProgress() {
    const el = document.getElementById('progress-grid');
    el.innerHTML = COURSES.map((c, i) => {
      const last = getLastLesson(c.id);
      const done = last ? last.lessonIndex + 1 : 0;
      const pct = Math.round(done / c.total * 100);
      const color = getCourseColor(c.color);
      const lastDate = last ? formatDate(last.date) : '尚未開始';
      const lastLesson = last ? LESSONS[c.id]?.[last.lessonIndex] || '' : '';
      return `<div class="progress-card">
        <div class="progress-card-header">
          <div>
            <div class="progress-course-name">${c.name}</div>
            <div style="font-size:12px;color:var(--text3);margin-top:2px">${c.hours}小時</div>
          </div>
          <div class="progress-badge" style="background:${color}20;color:${color}">${pct}%</div>
        </div>
        <div class="progress-stats">
          <div class="progress-stat">
            <div class="progress-stat-val" style="color:${color}">${done}</div>
            <div class="progress-stat-label">已完成堂數</div>
          </div>
          <div class="progress-stat">
            <div class="progress-stat-val">${c.total - done}</div>
            <div class="progress-stat-label">剩餘堂數</div>
          </div>
        </div>
        <div class="progress-bar-bg"><div class="progress-bar" style="width:${pct}%;background:${color}"></div></div>
        <div class="last-lesson">
          最後上課：${lastDate}<br>
          ${lastLesson ? `<span style="color:var(--text2)">${lastLesson}</span>` : ''}
        </div>
      </div>`;
    }).join('');
  }

  let lessonFilter = 'all';
  function renderLessons() {
    const el = document.getElementById('lessons-list');
    const isDesktop = window.innerWidth > 1024;
    const filterCourse = document.getElementById('lesson-course-filter')?.value || 'all';

    let rows = [];
    COURSES.forEach(c => {
      if (filterCourse !== 'all' && c.id !== filterCourse) return;
      const lessons = LESSONS[c.id] || [];
      const recs = state.records.filter(r => r.courseId === c.id);
      lessons.forEach((name, idx) => {
        const rec = recs.find(r => r.lessonIndex === idx);
        rows.push({ course: c, idx, name, rec });
      });
    });

    if (!rows.length) {
      el.innerHTML = '<div class="empty-state"><span class="material-symbols-rounded empty-icon" style="font-size:36px">menu_book</span><div class="empty-text">選擇課程查看堂數</div></div>';
      return;
    }
    const colorFn = (c) => getCourseColor(c.color);
    el.innerHTML = rows.map(({ course: c, idx, name, rec }) => {
      const statusText = rec
        ? (rec.status === 'partial' && rec.partialAt != null
            ? `<span class="material-symbols-rounded" style="font-size:13px">pause_circle</span> 上到 ${Math.floor(rec.partialAt/3600)?Math.floor(rec.partialAt/3600)+'時':''}${Math.floor((rec.partialAt%3600)/60)}分${rec.partialAt%60}秒 · ${formatDate(rec.date)}`
            : `<span class="material-symbols-rounded" style="font-size:13px">check_circle</span> ${formatDate(rec.date)}`)
        : '未上';
      const dur = LESSON_DURATIONS[c.id]?.[idx];
      const durStr = dur ? `${Math.floor(dur/3600)?Math.floor(dur/3600)+'時':''}${Math.floor((dur%3600)/60)}分` : '';
      return `<div class="lesson-item">
        <div class="lesson-num" style="background:${colorFn(c)}20;color:${colorFn(c)}">${idx+1}</div>
        <div class="lesson-info">
          <div class="lesson-name">${name}</div>
          <div class="lesson-meta">${c.name}${durStr?' · '+durStr:''} · ${statusText}</div>
        </div>
        <div class="lesson-actions">
          ${!rec ? `<button class="btn btn-ghost btn-sm" onclick="openRecordModal('${c.id}',${idx})">記錄</button>` :
                  `<button class="btn btn-danger btn-sm" onclick="deleteItem('record','${rec.id}')">刪除</button>`}
        </div>
      </div>`;
    }).join('');
  }

  function renderSchedules() {
    const el = document.getElementById('schedule-list');
    const today = new Date().toISOString().split('T')[0];
    let items = [...state.schedules].sort((a,b) => b.date?.localeCompare(a.date || '') || 0);

    if (state.scheduleFilter === 'upcoming') items = items.filter(s => s.date >= today && s.status !== 'completed');
    else if (state.scheduleFilter === 'completed') items = items.filter(s => s.status === 'completed');
    else if (state.scheduleFilter !== 'all') items = items.filter(s => s.courseId === state.scheduleFilter);

    if (!items.length) {
      el.innerHTML = '<div class="empty-state"><span class="material-symbols-rounded empty-icon" style="font-size:36px">event_note</span><div class="empty-text">暫無排課記錄</div></div>';
      return;
    }

    el.innerHTML = items.map(s => {
      const c = COURSES.find(c2 => c2.id === s.courseId);
      const color = c ? getCourseColor(c.color) : '#6c8ef7';
      const isCompleted = s.status === 'completed';
      const dt = s.date ? new Date(s.date) : null;
      const dateDisp = dt ? `${dt.getMonth()+1}/${dt.getDate()}` : '';
      const dayNames = ['日','一','二','三','四','五','六'];
      const dayDisp = dt ? `週${dayNames[dt.getDay()]}` : '';
      const lessons = LESSONS[s.courseId] || [];
      let detailStr = '';
      if (s.fromLesson !== undefined && s.toLesson !== undefined) {
        detailStr = `第${s.fromLesson+1}～${s.toLesson+1}堂`;
      } else if (s.minutes) {
        detailStr = `${s.minutes}分鐘`;
      }
      return `<div class="schedule-item">
        <div class="schedule-time-block">
          <div class="schedule-date" style="color:${color}">${dateDisp}</div>
          <div class="schedule-time">${dayDisp}</div>
          <div class="schedule-time">${s.time || ''}</div>
        </div>
        <div class="schedule-divider"></div>
        <div class="schedule-info">
          <div class="schedule-course">${c?.name || ''}</div>
          <div class="schedule-detail">${detailStr} ${s.note ? '· '+s.note : ''}</div>
        </div>
        <div style="display:flex;gap:8px;align-items:center">
          <span class="schedule-status ${isCompleted?'status-completed':'status-scheduled'}">${isCompleted?'完成':'排定'}</span>
          ${!isCompleted ? `<button class="btn btn-ghost btn-sm" onclick="markScheduleComplete('${s.id}')">完成</button>` : ''}
          <button class="btn btn-danger btn-sm" onclick="deleteItem('schedule','${s.id}')">刪除</button>
        </div>
      </div>`;
    }).join('');
  }

  // ==================== Navigation ====================
  window.navigate = function(page) {
    document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
    document.querySelector(`[data-page="${page}"]`)?.classList.add('active');
    document.querySelectorAll('.page').forEach(el => el.classList.remove('active'));
    document.getElementById('page-' + page)?.classList.add('active');
    state.activePage = page;
  };

  window.goToProgress = function(courseId) {
    navigate('lessons');
    setTimeout(() => {
      const sel = document.getElementById('lesson-course-filter');
      if (sel) { sel.value = courseId; renderLessons(); }
    }, 50);
  };

  // ==================== Calendar Nav ====================
  window.calPrev = function() {
    state.currentMonth--;
    if (state.currentMonth < 0) { state.currentMonth = 11; state.currentYear--; }
    renderCalendar();
  };
  window.calNext = function() {
    state.currentMonth++;
    if (state.currentMonth > 11) { state.currentMonth = 0; state.currentYear++; }
    renderCalendar();
  };

  window.showDayDetail = function(dateStr) {
    const activeSchedules = state.schedules.filter(s => s.status !== 'completed');
    const events = [...state.records, ...activeSchedules].filter(e => e.date?.startsWith(dateStr));
    if (!events.length) return;
    // Show in modal
    const list = events.map(e => {
      const c = COURSES.find(c2 => c2.id === e.courseId);
      const isRecord = state.records.includes(e);
      const lesson = isRecord && LESSONS[e.courseId]?.[e.lessonIndex];
      return `<div style="padding:8px 0;border-bottom:1px solid var(--border)">
        <div style="font-size:13px;font-weight:600;color:var(--text)">${c?.name}</div>
        <div style="font-size:12px;color:var(--text2)">${isRecord 
            ? '<span class="material-symbols-rounded" style="font-size:13px">check_circle</span> '+lesson 
            : '<span class="material-symbols-rounded" style="font-size:13px">event</span> 排課'} ${e.time||''}</div>
      </div>`;
    }).join('');
    document.getElementById('day-detail-date').textContent = formatDate(dateStr);
    document.getElementById('day-detail-list').innerHTML = list;
    document.getElementById('modal-day').classList.add('open');
  };

  // ==================== Record Modal ====================
  function updateRecLessonOptions(courseId, selected) {
      const sel = document.getElementById('rec-lesson');
      const lessons = LESSONS[courseId] || [];
      sel.innerHTML = lessons.map((l, i) => `<option value="${i}" ${i===selected?'selected':''}>${i+1}. ${l}</option>`).join('');
    }

  window.openRecordModal = function(courseId, lessonIndex) {
    
    document.getElementById('rec-course').innerHTML = COURSES.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
    updateRecLessonOptions(courseId, lessonIndex);
    if (lessonIndex !== undefined) document.getElementById('rec-lesson').value = lessonIndex;
    const now = new Date();
    document.getElementById('rec-date').value = now.toISOString().split('T')[0];
    //document.getElementById('rec-time').value = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
    document.getElementById('modal-record').classList.add('open');
  };

  document.getElementById('rec-course').addEventListener('change', function() {
    updateRecLessonOptions(this.value);
  });

  document.getElementById('rec-course').innerHTML = COURSES.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
  updateRecLessonOptions(COURSES[0].id);

  document.getElementById('save-record').onclick = async function() {
    const courseId = document.getElementById('rec-course').value;
    const lessonIndex = parseInt(document.getElementById('rec-lesson').value);
    const date = document.getElementById('rec-date').value;
    const time = '';
    const note = document.getElementById('rec-note').value;
    const recStatus = document.getElementById('rec-status').value;
    const partialHr  = parseInt(document.getElementById('rec-partial-hr').value)  || 0;
    const partialMin = parseInt(document.getElementById('rec-partial-min').value) || 0;
    const partialSec = parseInt(document.getElementById('rec-partial-sec').value) || 0;
    
    if (!courseId || isNaN(lessonIndex) || !date) { showToast('請填寫所有必要欄位', 'error'); return; }

    // Remove existing record for same lesson
    const existing = state.records.find(r => r.courseId === courseId && r.lessonIndex === lessonIndex);
    if (existing) { await deleteItem('record', existing.id); }

    // 自動補登前面所有未完成的課程
    for (let i = 0; i < lessonIndex; i++) {
      const alreadyDone = state.records.find(r => r.courseId === courseId && r.lessonIndex === i);
      if (!alreadyDone) {
        await saveRecord({ courseId, lessonIndex: i, date, time, note: '自動補登', status: 'done', partialAt: null });
      }
    }

    await saveRecord({ courseId, lessonIndex, date, time, note,
      status: recStatus,
      partialAt: recStatus === 'partial' ? partialHr * 3600 + partialMin * 60 + partialSec : null
    });
    closeModal('modal-record');
    document.getElementById('rec-note').value = '';
  };

  // ==================== Schedule Modal ====================

  window.openScheduleModal = function(courseId, lessonIndex) {
    const now = new Date();
    document.getElementById('sch-course').innerHTML = COURSES.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
    document.getElementById('sch-date').value = now.toISOString().split('T')[0];
    document.getElementById('sch-time').value = '09:00';
    document.getElementById('modal-schedule').classList.add('open');
  };

  window.openEditScheduleModal = function(scheduleId) {
    const s = state.schedules.find(s => s.id === scheduleId);
    if (!s) return;
    document.getElementById('sch-course').innerHTML = COURSES.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
    document.getElementById('sch-course').value = s.courseId;
    document.getElementById('sch-date').value = s.date || '';
    document.getElementById('sch-time').value = s.time || '09:00';
    document.getElementById('sch-minutes').value = s.minutes || 200;
    document.getElementById('sch-note').value = s.note || '';
    // 暫存編輯中的 id
    document.getElementById('modal-schedule').dataset.editId = scheduleId;
    document.getElementById('modal-schedule').classList.add('open');
  };

  document.getElementById('save-schedule').onclick = async function() {
    const courseId = document.getElementById('sch-course').value;
    const date = document.getElementById('sch-date').value;
    const time = document.getElementById('sch-time').value;
    const note = document.getElementById('sch-note').value;
    if (!courseId || !date) { showToast('請填寫必要欄位', 'error'); return; }

    const data = { courseId, date, time, note };
    data.minutes = parseInt(document.getElementById('sch-minutes').value) || 200;

    const editId = document.getElementById('modal-schedule').dataset.editId;
    if (editId) {
      // 編輯模式：更新 Firestore
      try {
        await updateDoc(doc(db, 'schedules', editId), data);
        const idx = state.schedules.findIndex(s => s.id === editId);
        if (idx !== -1) state.schedules[idx] = { ...state.schedules[idx], ...data };
        showToast('排課已更新');
      } catch(e) { showToast('更新失敗', 'error'); }
      delete document.getElementById('modal-schedule').dataset.editId;
    } else {
      // 新增模式
      data.status = 'scheduled';
      await saveSchedule(data);
    }
    closeModal('modal-schedule');
    document.getElementById('sch-note').value = '';
    renderAll();
  };

  // ==================== Utils ====================
  window.closeModal = function(id) { document.getElementById(id).classList.remove('open'); };
  window.markScheduleComplete = markScheduleComplete;
  window.deleteItem = deleteItem;
  window.openRecordModal = openRecordModal;
  window.openScheduleModal = openScheduleModal;

  function formatDate(dateStr) {
    if (!dateStr) return '';
    const d = new Date(dateStr);
    return `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}`;
  }

  function showToast(msg, type = 'success') {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = `toast ${type} show`;
    setTimeout(() => t.className = 'toast', 2800);
  }
  window.showToast = showToast;

  // Schedule filter buttons
  window.setScheduleFilter = function(f) {
    state.scheduleFilter = f;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.toggle('active', b.dataset.filter === f));
    renderSchedules();
  };

  // Lesson filter
  document.getElementById('lesson-course-filter').innerHTML = `<option value="all">所有課程</option>` + COURSES.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
  document.getElementById('lesson-course-filter').addEventListener('change', renderLessons);

  document.getElementById('rec-status').addEventListener('change', function() {
    document.getElementById('rec-partial-row').style.display = this.value === 'partial' ? 'grid' : 'none';
  });

  // Init
  // loadData();
  navigate('home');

  
</script>

</body>



</html>
